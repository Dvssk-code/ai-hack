<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Работа команды 2</title>
<style>
body{margin:0;background:#0a1420;color:#dce8f5;font-family:Consolas,monospace;display:flex;justify-content:center}
.wrap{text-align:center;padding:18px}
h1{letter-spacing:4px;font-size:22px;margin:0 0 12px}
.boards{display:flex;gap:28px;justify-content:center;flex-wrap:wrap}
.bt{margin-bottom:8px;font-size:14px;color:#7fa6c9}
.grid{display:grid;grid-template-columns:repeat(10,26px);gap:2px}
.c{width:26px;height:26px;background:#12202f;border:1px solid #1d3a55;cursor:default}
#eg .c{cursor:crosshair}
#eg .c:hover{background:#1b3350}
.ship{background:#2a4a6b}
.miss:after{content:"·";color:#3d5a78;font-size:18px;line-height:26px;display:block}
.hit{background:#7a2a2a}
.hit:after{content:"×";color:#ff9d9d;font-size:18px;display:block;line-height:26px}
.sunk{background:#4a1515}
.sunk:after{content:"✕";color:#ff5d5d;font-size:18px;display:block;line-height:26px}
.status{margin:12px 0;font-size:15px;min-height:22px}
.btn{margin-top:6px;background:#1d3a55;color:#fff;border:1px solid #2a4a6b;padding:8px 18px;font-family:Consolas,monospace;font-size:13px;cursor:pointer}
.btn:hover{background:#26507a}
@media(max-width:640px){.boards{flex-direction:column;align-items:center;gap:16px}.grid{gap:3px}.c{width:28px;height:28px}.miss:after,.hit:after,.sunk:after{line-height:28px;font-size:20px}}
</style>
</head>
<body>
<div class="wrap"><h1>МОРСКОЙ БОЙ</h1><div class="boards"><div class="b"><div class="bt">ВАШ ФЛОТ</div><div class="grid" id="pg"></div></div><div class="b"><div class="bt">ФЛОТ ПРОТИВНИКА</div><div class="grid" id="eg"></div></div></div><div class="status" id="st">Стреляйте по клеткам врага!</div><button class="btn" id="reset">Новая игра</button></div>
<script>
var S=10,SHIPS=[4,3,3,2,2,2,1,1,1,1];
var P,E,turn,over;
function makeBoard(){
  var g=[],ships=[],y;
  for(y=0;y<S;y++){g.push(Array(S).fill(null));}
  SHIPS.forEach(function(len){
    var placed=false;
    while(!placed){
      var h=Math.random()<.5;
      var x0=Math.random()*(S-(h?len-1:0))|0;
      var y0=Math.random()*(S-(h?0:len-1))|0;
      var cells=[];
      for(var i=0;i<len;i++){cells.push({x:x0+(h?i:0),y:y0+(h?0:i)});}
      var ok=true;
      for(var j=0;j<cells.length&&ok;j++){
        var c=cells[j];
        for(var dx=-1;dx<=1&&ok;dx++)for(var dy=-1;dy<=1;dy++){
          var nx=c.x+dx,ny=c.y+dy;
          if(nx>=0&&ny>=0&&nx<S&&ny<S&&g[ny][nx]!==null){ok=false;break;}
        }
      }
      if(ok){cells.forEach(function(c){g[c.y][c.x]=ships.length;});ships.push({cells:cells,hits:0,len:len});placed=true;}
    }
  });
  return {g:g,ships:ships,shots:Array.from({length:S},function(){return Array(S).fill(false);})};
}
function build(){
  var pg=document.getElementById("pg"),eg=document.getElementById("eg");
  pg.innerHTML="";eg.innerHTML="";
  for(var y=0;y<S;y++)for(var x=0;x<S;x++){
    var a=document.createElement("div");a.className="c";
    if(P.g[y][x]!==null)a.classList.add("ship");
    pg.appendChild(a);
    var b=document.createElement("div");b.className="c";
    (function(ex,ey){b.onclick=function(){fireAt(ex,ey);};})(x,y);
    eg.appendChild(b);
  }
}
function markGrid(el,board,showShips){
  for(var y=0;y<S;y++)for(var x=0;x<S;x++){
    var c=el.children[y*S+x];
    c.className="c";
    if(showShips&&board.g[y][x]!==null)c.classList.add("ship");
    if(board.shots[y][x]){
      var si=board.g[y][x];
      if(si===null){c.classList.add("miss");}
      else{
        c.classList.add("hit");
        if(board.ships[si].hits===board.ships[si].len)c.classList.add("sunk");
      }
    }
  }
}
var st=document.getElementById("st");
function fire(board,x,y){
  board.shots[y][x]=true;
  var si=board.g[y][x];
  var r={hit:si!==null,sunk:false};
  if(r.hit){
    var sh=board.ships[si];sh.hits++;
    if(sh.hits===sh.len){r.sunk=true;}
    if(board.ships.every(function(s){return s.hits===s.len;}))board.over=true;
  }
  return r;
}
function fireAt(x,y){
  if(over||turn!=="player"||E.shots[y][x])return;
  var r=fire(E,x,y);
  markGrid(document.getElementById("eg"),E,false);
  if(E.over){end(true);return;}
  if(r.sunk)st.textContent="Корабль потоплен! Стреляйте ещё.";else if(r.hit)st.textContent="Попадание! Стреляйте ещё.";else{st.textContent="Мимо. Ход противника…";turn="enemy";setTimeout(enemyShot,700);}
}
function enemyShot(){
  if(over)return;
  var cand=[];
  P.ships.forEach(function(s){
    if(s.hits>0&&s.hits<s.len)s.cells.forEach(function(c){
      [[1,0],[-1,0],[0,1],[0,-1]].forEach(function(d){
        var nx=c.x+d[0],ny=c.y+d[1];
        if(nx>=0&&ny>=0&&nx<S&&ny<S&&!P.shots[ny][nx])cand.push({x:nx,y:ny});
      });
    });
  });
  var x,y;
  if(cand.length){var c=cand[Math.random()*cand.length|0];x=c.x;y=c.y;}
  else{
    var tries=0;
    do{x=Math.random()*S|0;y=Math.random()*S|0;tries++;}while(P.shots[y][x]&&tries<300);
    if(P.shots[y][x])return;
  }
  var r=fire(P,x,y);
  markGrid(document.getElementById("pg"),P,true);
  if(P.over){end(false);return;}
  if(r.sunk)st.textContent="Нам потопили корабль! Ваш ход.";else if(r.hit)st.textContent="Противник попал! Ваш ход.";else st.textContent="Противник промахнулся. Ваш ход.";turn="player";
}
function end(win){
  over=true;
  st.textContent=win?"ПОБЕДА! Флот противника уничтожен.":"ПОРАЖЕНИЕ — ваш флот потоплен.";st.style.color=win?"#5dff9d":"#ff7d7d";
}
function newGame(){
  P=makeBoard();E=makeBoard();turn="player";over=false;
  st.style.color="";st.textContent="Стреляйте по клеткам врага!";
  build();markGrid(document.getElementById("pg"),P,true);markGrid(document.getElementById("eg"),E,false);
}
document.getElementById("reset").onclick=newGame;
newGame();
</script>
</body>
</html>
